<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Campus Connect</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <div class="auth-logo">
            🎓
        </div>

        <h1>Welcome Back</h1>

        <p>Login to your Campus Connect account</p>


        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p class="auth-switch">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </p>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
