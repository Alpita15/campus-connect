```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Campus Connect</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;

            width: 400px;
            max-width: 90%;

            padding: 40px;

            border-radius: 18px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #1e3a8a;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #1e3a8a;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #172554;
        }

    </style>

</head>


<body>

    <div class="login-card">

        <h1>🎓 Campus Connect</h1>

        <p class="subtitle">
            Student Login
        </p>


        <form id="loginForm">

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >


            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label for="studentId">
                Student ID
            </label>

            <input
                type="text"
                id="studentId"
                placeholder="Enter student ID"
                required
            >


            <label for="department">
                Department
            </label>

            <input
                type="text"
                id="department"
                value="Computer Science"
                required
            >


            <label for="semester">
                Semester
            </label>

            <input
                type="text"
                id="semester"
                value="2nd Semester"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>

    </div>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const user = {

                    name: document
                        .getElementById("name")
                        .value,

                    email: document
                        .getElementById("email")
                        .value,

                    studentId: document
                        .getElementById("studentId")
                        .value,

                    department: document
                        .getElementById("department")
                        .value,

                    semester: document
                        .getElementById("semester")
                        .value

                };


                // SAVE USER

                localStorage.setItem(
                    "campusUser",
                    JSON.stringify(user)
                );


                // OPEN PROFILE

                window.location.href = "profile.html";

            });

    </script>

</body>

</html>
```
